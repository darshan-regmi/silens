name: Release Latest EAS Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.3.0 requires Node >=22.13, and some transitive Expo deps import
          # `node:sqlite` which is a built-in starting Node 22.5. Node 22 satisfies both.
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          # Pinned: eas-cli 20.0.0 has a regression in `build:list`. Re-evaluate later.
          eas-version: 19.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Fetch latest successful EAS build
        id: eas
        run: |
          set +e
          OUTPUT=$(eas build:list \
            --platform android \
            --profile production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive 2>&1)
          EC=$?
          echo "::group::eas build:list output (exit=$EC)"
          echo "$OUTPUT"
          echo "::endgroup::"
          if [ $EC -ne 0 ]; then
            echo "::error::eas build:list failed with exit code $EC"
            exit $EC
          fi

          APK_URL=$(echo "$OUTPUT" | jq -r '.[0].artifacts.buildUrl')
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.[0].id')
          BUILD_VERSION=$(echo "$OUTPUT" | jq -r '.[0].appVersion')

          if [ "$APK_URL" = "null" ] || [ -z "$APK_URL" ]; then
            echo "::error::No finished EAS build found for production profile."
            exit 1
          fi

          echo "url=$APK_URL" >> $GITHUB_OUTPUT
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.eas.outputs.url }}" -o silens-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: silens-release.apk
          generate_release_notes: true
          body: |
            **EAS Build ID:** `${{ steps.eas.outputs.build_id }}`
            **App Version:** `${{ steps.eas.outputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
